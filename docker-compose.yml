services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # ربط السيرفر بقاعدة البيانات المحلية على جهازك بدل الإنترنت
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/yosemite_local
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - app-network

  # خدمة قاعدة البيانات المحلية (عشان السجلات والفواتير تتحفظ عندك)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=yosemite_local
    ports:
      - "5432:5432"
    volumes:
      - local_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  # خدمة تسريع الأداء والكاش (Redis)
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# مساحة تخزين دائمة عشان البيانات متتمسحش لما تقفل الكمبيوتر
volumes:
  local_db_data:
